<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Practice Pit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: a TradingView-style desk. Top toolbar, drawing tools down the left, the chart in the middle, plan + order panel on the right,
   trading panel (positions / orders / history / journal) along the bottom. Stacks to one column on phones. */
:root{
  --bg:#f0f3fa; --panel:#ffffff; --panel2:#f0f3fa; --ink:#131722; --muted:#6a6d78; --line:#e0e3eb; --hover:#f0f3fa;
  --blue:#2962ff; --blue-soft:#e3ebff; --up:#089981; --down:#f23645; --up-soft:#e0f4ef; --down-soft:#fde8eb;
  --warn:#e67700; --warn-soft:#fff2df; --gold:#f2b705; --chart-bg:#ffffff; --grid:#f0f3fa; --label:#131722;
  --window:rgba(41,98,255,.055); --sep:rgba(106,109,120,.35);
  --ui:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0e14; --panel:#131722; --panel2:#1e222d; --ink:#d1d4dc; --muted:#787b86; --line:#2a2e39; --hover:#2a2e39;
    --blue:#2962ff; --blue-soft:#142347; --up:#089981; --down:#f23645; --up-soft:#0c2b27; --down-soft:#3a1519;
    --warn:#ff9800; --warn-soft:#33240c; --gold:#f5c33b; --chart-bg:#131722; --grid:#1c202b; --label:#363a45;
    --window:rgba(41,98,255,.08); --sep:rgba(120,123,134,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0e14; --panel:#131722; --panel2:#1e222d; --ink:#d1d4dc; --muted:#787b86; --line:#2a2e39; --hover:#2a2e39;
  --blue:#2962ff; --blue-soft:#142347; --up:#089981; --down:#f23645; --up-soft:#0c2b27; --down-soft:#3a1519;
  --warn:#ff9800; --warn-soft:#33240c; --gold:#f5c33b; --chart-bg:#131722; --grid:#1c202b; --label:#363a45;
  --window:rgba(41,98,255,.08); --sep:rgba(120,123,134,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--ui);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.ok{color:var(--up)} .bad{color:var(--down)} .meh{color:var(--warn)} .mut{color:var(--muted)}

.tv{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr) 210px;gap:4px;max-width:1700px;margin:0 auto}
@media (max-width:1020px){.tv{height:auto;grid-template-rows:auto}}

/* top toolbar */
.tb{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;gap:2px;padding:4px 6px;flex-wrap:wrap;min-width:0}
.logo{font:800 13px var(--ui);letter-spacing:.06em;background:var(--gold);color:#1d1600;border-radius:4px;padding:4px 6px;margin-right:4px}
.sym{font-weight:700;font-size:14px;padding:5px 8px}
.div{width:1px;height:22px;background:var(--line);margin:0 4px}
.tbtn{border:0;background:transparent;border-radius:4px;padding:5px 8px;font-weight:600;color:var(--ink);white-space:nowrap}
.tbtn:hover{background:var(--hover)}
.tbtn[aria-pressed="true"]{color:var(--blue);background:var(--blue-soft)}
.tbtn.primary{background:var(--blue);color:#fff}
.tbtn.primary:hover{filter:brightness(1.08)}
.tbtn[disabled]{opacity:.4;cursor:not-allowed}
.grow{flex:1}
.clock{font-size:12px;color:var(--muted);padding:0 6px;white-space:nowrap}
.clock b{color:var(--ink);font-weight:600}
.bank{font-weight:700;padding:0 6px;white-space:nowrap}

/* main row */
.main{display:grid;grid-template-columns:42px minmax(0,1fr) 320px;gap:4px;min-height:0}
@media (max-width:1020px){.main{grid-template-columns:minmax(0,1fr)}}
.tools{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;overflow:auto}
@media (max-width:1020px){.tools{flex-direction:row;padding:0 4px;overflow-x:auto}}
.tool{width:34px;height:34px;flex:none;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;color:var(--ink)}
.tool:hover{background:var(--hover)}
.tool[aria-pressed="true"]{color:var(--blue);background:var(--blue-soft)}
.tool svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tools .sep{width:24px;height:1px;background:var(--line);margin:4px 0;flex:none}
@media (max-width:1020px){.tools .sep{width:1px;height:24px;margin:0 4px}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.chartbox{position:relative;flex:1;min-height:0}
#chart{position:absolute;inset:0}
@media (max-width:1020px){.chartbox{flex:none;height:58vh;min-height:300px}}
#chart.c-move canvas{cursor:move!important} #chart.c-ns canvas{cursor:ns-resize!important} #chart.c-pt canvas{cursor:pointer!important} #chart.c-draw canvas{cursor:crosshair!important}
.legend{position:absolute;left:10px;top:6px;z-index:4;pointer-events:none;font-size:12.5px;display:flex;flex-wrap:wrap;gap:2px 10px;max-width:calc(100% - 90px)}
.legend b{font-weight:700} .legend span{font-variant-numeric:tabular-nums}
.seltb{position:absolute;top:34px;left:50%;transform:translateX(-50%);z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.14);display:flex;align-items:center;gap:4px;padding:4px 6px;white-space:nowrap;max-width:calc(100% - 16px);overflow-x:auto}
.sw{width:18px;height:18px;flex:none;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:7;background:var(--label);color:#fff;padding:7px 12px;border-radius:6px;font-weight:600;max-width:calc(100% - 24px);text-align:center}
.pickhint{position:absolute;left:50%;top:34px;transform:translateX(-50%);z-index:6;background:var(--gold);color:#1d1600;font-weight:700;padding:5px 10px;border-radius:6px}
.result{position:absolute;right:12px;top:34px;z-index:6;width:min(340px,calc(100% - 24px));max-height:calc(100% - 44px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:14px}
.result h3{margin:0;font-size:19px}
.stars{font-size:22px;letter-spacing:2px;color:var(--gold)} .stars .off{color:var(--line)}
.strip{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:4px 6px;border-top:1px solid var(--line)}
.strip .lbl{color:var(--muted);font-size:12px;padding:0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 8px;font-weight:600;font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* right side */
.right{display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 8px}
.ph h2{margin:0;font-size:14px;font-weight:700}
.ph small{color:var(--muted)}
.chip{font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 6px;border-radius:3px;text-transform:uppercase;background:var(--panel2);color:var(--muted)}
.chip.t0{background:var(--up-soft);color:var(--up)} .chip.t1{background:var(--blue-soft);color:var(--blue)} .chip.t2{background:var(--warn-soft);color:var(--warn)} .chip.t3,.chip.t4{background:var(--down-soft);color:var(--down)}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.news li{display:grid;grid-template-columns:10px 54px 1fr auto;gap:6px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.h{background:var(--down)} .dot.m{background:var(--warn)} .dot.x{background:var(--muted)}
.news .t,.news .v{color:var(--muted);font-variant-numeric:tabular-nums} .news .v b{color:var(--ink)}
.q{margin-top:8px} .q p{margin:0 0 5px;font-weight:600}
.choices{display:flex;flex-wrap:wrap;gap:4px}
.choice{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:5px 9px;font-weight:600}
.choice:hover{background:var(--hover)}
.choice[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
.verdict{margin-top:8px;border-radius:4px;padding:8px 10px}
.verdict ul{margin:4px 0 0;padding-left:16px}
.v-NO{background:var(--down-soft)} .v-OK{background:var(--up-soft)} .v-WAIT,.v-CAUTION{background:var(--warn-soft)}
.bs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bsb{border:0;border-radius:4px;padding:8px 8px;color:#fff;text-align:left;line-height:1.2;opacity:.8;font-weight:700}
.bsb b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.bsb.sell{background:var(--down)} .bsb.buy{background:var(--up);text-align:right}
.bsb[aria-pressed="true"]{opacity:1}
.bsb.sell[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--down)} .bsb.buy[aria-pressed="true"]{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--up)}
.fld{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:6px;align-items:center;margin-top:6px}
.fld label{color:var(--muted);display:flex;align-items:center;gap:4px}
.fld input[type=number]{width:100%;min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 7px;font-variant-numeric:tabular-nums}
.fld input[disabled]{opacity:.45}
.fld .aux{color:var(--muted);font-size:12px;white-space:nowrap}
.quick{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;align-items:center}
.quick button{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:3px 8px;font-size:12px;font-weight:600}
.quick button[aria-pressed="true"]{border-color:var(--blue);color:var(--blue);background:var(--blue-soft)}
.sum{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);line-height:1.6}
.warnbox{margin-top:6px;background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:6px 8px;font-weight:600}
.go{width:100%;margin-top:10px;border:0;border-radius:4px;padding:11px;font-size:15px;font-weight:800;letter-spacing:.03em;color:#fff;background:var(--blue)}
.go.buy{background:var(--up)} .go.sell{background:var(--down)}
.go[disabled]{opacity:.4;cursor:not-allowed}
.checks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.checks label{display:flex;gap:6px;align-items:flex-start;cursor:pointer}
.checks input{margin-top:2px;accent-color:var(--blue)}
.auto{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:12px}
.small{font-size:12px;color:var(--muted)}
.big{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:6px 10px;font-weight:600}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}

/* bottom trading panel */
.bottom{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
@media (max-width:1020px){.bottom{height:260px}}
.acct{display:flex;gap:18px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.acct b{color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums;margin-left:4px}
.tabs{display:flex;gap:2px;padding:0 6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:transparent;padding:6px 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}
.tabbody{flex:1;overflow:auto;padding:0 6px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:600;color:var(--muted);padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:5px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.empty{color:var(--muted);padding:12px 6px}

/* dialogs */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.5);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--panel);border-radius:8px;width:100%;max-width:820px;padding:18px 20px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.sheet h2{font-size:22px;margin:0 0 4px;text-wrap:balance}
.sheet h3{font-size:15px;margin:16px 0 8px}
.x{float:right;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (max-width:560px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--panel2);border-radius:6px;padding:8px 10px}
.tile .k{font-size:12px;color:var(--muted)} .tile .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.tier{margin-top:14px}
.tierh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.lv{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:5px;margin-top:6px}
.lvb{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 0 3px;font-weight:700;line-height:1.1}
.lvb small{display:block;font-size:10px;letter-spacing:1px;color:var(--gold)}
.lvb small .off{color:var(--line)}
.lvb:hover{border-color:var(--blue)}
.lvb.done{background:var(--panel2)}
.lvb[disabled]{opacity:.35;cursor:not-allowed}
.note{color:var(--muted)}
.err{background:var(--down-soft);color:var(--down);border-radius:4px;padding:8px 10px;font-weight:600}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="tv">
  <header class="tb">
    <span class="logo">PIT</span><span class="sym">SPX500</span>
    <div class="div"></div>
    <div id="tfs" role="group" aria-label="Timeframe" style="display:flex;gap:2px"></div>
    <div class="div"></div>
    <button class="tbtn" type="button" id="modeLevels" aria-pressed="true">Levels</button>
    <button class="tbtn" type="button" id="modeReplay" aria-pressed="false">Replay a day</button>
    <span class="grow"></span>
    <span class="clock">NY <b id="ny">--</b> · Perth <b id="perth">--</b></span>
    <span class="bank" id="bankTop">$1,000</span>
    <button class="tbtn" type="button" id="statsBtn">Stats</button>
    <button class="tbtn primary" type="button" id="mapBtn">Level map</button>
  </header>
  <div id="fatal"></div>
  <div class="main">
    <nav class="tools" id="tools" aria-label="Drawing tools"></nav>

</div>
<div class="ov" id="ovMap" hidden><div class="sheet" id="mapBody"></div></div>
<div class="ov" id="ovStats" hidden><div class="sheet" id="statsBody"></div></div>
<div class="ov" id="ovReview" hidden><div class="sheet" id="reviewBody"></div></div>
<div class="ov" id="ovNew" hidden><div class="sheet" id="newBody"></div></div>

<script>
"use strict";
// ================================================================ constants + helpers
const T0 = Date.UTC(2018, 0, 1) / 1000;          // candle times = New York wall-clock minutes since 1 Jan 2018
const SPREAD = 0.5, START_BAL = 10000, START_BANK = 1000, UNLOCK = 15;
const TFS = [["1m", 1], ["5m", 5], ["15m", 15], ["1h", 60], ["4h", 240], ["D", 1440]];
const SHOW = {"D": 90, "4h": 90, "1h": 100, "15m": 110, "5m": 130, "1m": 150};
const SPEEDS = [1, 2, 4, 8, 16], PLAY_SPEEDS = [5, 15, 40];
const TIERS = ["Rookie", "Trader", "Pro", "Elite", "Legend"];
const PALETTE = ["#2962ff", "#f23645", "#089981", "#ff9800", "#9c27b0", "#787b86"];
const FIBS = [0, 0.5, 0.618, 0.705, 0.79, 1];
const FONT = '-apple-system, BlinkMacSystemFont, "Trebuchet MS", Roboto, Ubuntu, sans-serif';
const CHECKS = [
  "Daily and 4H charts point the same way as this trade",
  "Price swept an obvious old high or low first",
  "A candle BODY closed past the last swing the other way",
  "If a 1H/4H level was swept: I waited for the 5-min pull-back",
  "Entering on a pull-back into the order block or gap",
  "Stop sits just past the sweep's wick",
  "Target 1 is the next obvious high/low, at least 1R away",
];
const OVERLAYS = ["ovMap", "ovStats", "ovReview", "ovNew"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const r2 = x => Math.round(x * 100) / 100;
const q25 = x => Math.round(x * 4) / 4;
const fmtP = x => x == null || isNaN(x) ? "--" : (+x).toFixed(2);
const fmtR = x => (x > 0 ? "+" : "") + (+x).toFixed(2) + "R";
const usd = (x, dp) => { const d = dp ?? (Math.abs(x) < 1000 ? 2 : 0); return (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString("en-US", {minimumFractionDigits: d, maximumFractionDigits: d}); };
const sgnUsd = x => (x > 0 ? "+" : "") + usd(x);
const mod = t => ((t % 1440) + 1440) % 1440;
const clone = o => JSON.parse(JSON.stringify(o));
function hm(min) { min = Math.round(min); const h = Math.floor(mod(min) / 60), m = mod(min) % 60; return (h % 12 || 12) + ":" + String(m).padStart(2, "0") + (h < 12 ? "am" : "pm"); }
const WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], WDL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const wdOf = iso => new Date(iso + "T12:00:00Z").getUTCDay();
function dateLong(iso) { const d = new Date(iso + "T12:00:00Z"); return `${WDL[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${d.getUTCFullYear()}`; }
function nyOffset(iso) { const h = new Date(iso + "T16:00:00Z").toLocaleString("en-US", {timeZone: "America/New_York", hour: "numeric", hour12: false}); return +h - 16; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
const toMin = hhmm => +hhmm.slice(0, 2) * 60 + +hhmm.slice(3, 5);

// ================================================================ storage (the artifact's db when available, else this browser)
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const freshProg = () => ({bank: START_BANK, blown: 0, best: {}, tries: []});
const store = {
  db: null,
  games: lsGet("pit-games", []),
  settings: Object.assign({start: 540, pool: "all", strict: true, speed: 2, playSpeed: 15, mode: "levels"}, lsGet("pit-settings", {})),
  prog: Object.assign(freshProg(), lsGet("pit-progress", {})),
};
let dbChain = Promise.resolve();
function dbWrite(path, data) { if (!store.db) return; const body = clone(data); dbChain = dbChain.then(() => store.db.doc(path).set(body)).catch(() => {}); }

  const fld = (k, label, val, aux) => `<div class="fld"><label for="o-${k}">${label}</label><input id="o-${k}" type="number" step="0.25" inputmode="decimal" value="${val ?? ""}" placeholder="${k === "t2" ? "optional" : ""}"><span class="aux">${aux}</span></div>`;
  h += `<div class="seg" style="margin-top:8px"><button type="button" data-type="market" aria-pressed="${tk.type === "market"}">Market</button><button type="button" data-type="limit" aria-pressed="${tk.type === "limit"}">Limit</button></div>`;
  if (tk.type === "limit") h += fld("limit", "Limit price", tk.limit, "");
  h += fld("stop", "Stop loss", tk.stop, riskPts > 0 ? riskPts.toFixed(2) + " pts" : "") + fld("t1", tk.t2 != null ? "Take profit 1" : "Take profit", tk.t1, rr.toFixed(2) + "R") + fld("t2", "Take profit 2", tk.t2, tk.t2 != null ? "rest" : "");
  h += `<div class="sum">Risk ${usd(riskD)} (1% of ${usd(L.bal, 0)}) · ≈ ${riskPts > 0 ? (riskD / riskPts / 5).toFixed(1) : "--"} MES${tk.t2 != null ? "<br>Half off at TP1, stop to break-even, rest to TP2" : ""}</div>`;
  h += `<ul class="checks">${CHECKS.map((c, i) => `<li><label><input type="checkbox" data-ck="${i}" ${tk.checks[i] ? "checked" : ""}> <span>${esc(c)}</span></label></li>`).join("")}</ul>`;
  const rules = autoRules(tk), allOk = rules.every(r => r.ok) && tk.checks.every(Boolean);
  h += `<ul class="auto">${rules.map(r => `<li class="${r.ok ? "ok" : "bad"}">${r.ok ? "✓" : "✗"} ${esc(r.txt)}</li>`).join("")}</ul>
    <button class="go ${long ? "buy" : "sell"}" type="button" id="placeBtn" ${g.strict && !allOk ? "disabled" : ""}>${tk.type === "limit" ? `${long ? "Buy" : "Sell"} limit ${fmtP(tk.limit)}` : `${long ? "Buy" : "Sell"} ${riskPts > 0 ? (riskD / riskPts / 5).toFixed(1) : ""} MES @ MKT`}</button>
    ${!allOk ? `<div class="small" style="margin-top:4px">${g.strict ? "Strict mode: locked until every line is true." : "Not every rule is met; it will be logged as a rule break."}</div>` : ""}
    <div class="row"><button class="btn" type="button" id="clearTk">Clear</button></div></section>`;
  return h;
}
function bindOrder() {

  if ($("closeBtn")) $("closeBtn").onclick = closeNow;
  if ($("cancelBtn")) $("cancelBtn").onclick = () => { g.order = null; log("Limit order cancelled."); drawTradeLines(); renderRight(); renderBottom(); };

  el.querySelectorAll("[data-type]").forEach(b => b.onclick = () => { tk.type = b.dataset.type; if (tk.type === "limit") tk.limit = q25(lastClose()); drawTradeLines(); renderRight(); });
  el.querySelectorAll("input[type=number]").forEach(i => i.onchange = () => { tk[i.id.slice(2)] = i.value === "" ? null : +i.value; drawTradeLines(); renderRight(); });
  el.querySelectorAll("[data-ck]").forEach(c => c.onchange = () => { tk.checks[+c.dataset.ck] = c.checked; renderRight(); });
  $("placeBtn").onclick = placeOrder;
  $("clearTk").onclick = () => { g.ticket = null; drawTradeLines(); renderRight(); };
}
let activeTab = "positions";

  $("tabbody").innerHTML = tabBody(lv);

}
function tabBody(lv) {

  if (activeTab === "positions") {
    const head = `<thead><tr><th>Symbol</th><th>Side</th><th>Avg fill</th><th>Take profit</th><th>Stop loss</th><th>Last</th><th>P&amp;L</th><th></th></tr></thead>`;
    if (lv && g.lp && g.lp.open) {
      const p = g.lp, dir = p.side === "long" ? 1 : -1, R = ((lastClose() - SPREAD / 2 * dir) - p.entry) * dir / p.risk;
      return `<table class="tbl">${head}<tbody><tr><td>SPX500</td><td class="${dir > 0 ? "ok" : "bad"}">${p.side === "long" ? "Long" : "Short"}</td><td>${fmtP(p.entry)}</td><td>${fmtP(p.tp)}</td><td>${fmtP(p.stop)}</td><td>${fmtP(lastClose())}</td><td class="${R >= 0 ? "ok" : "bad"}">${sgnUsd(r2(R * p.riskD))} (${fmtR(R)})</td><td><button class="btn" type="button" id="tbCloseLv">Close</button></td></tr></tbody></table>`;
    }

      const p = g.pos, R = openR();
      return `<table class="tbl">${head}<tbody><tr><td>SPX500</td><td class="${p.side === "long" ? "ok" : "bad"}">${p.side === "long" ? "Long" : "Short"}${p.half ? " (half)" : ""}</td><td>${fmtP(p.entry)}</td><td>${p.half ? fmtP(p.t2) : fmtP(p.t1)}</td><td>${fmtP(p.stop)}</td><td>${fmtP(lastClose())}</td><td class="${R >= 0 ? "ok" : "bad"}">${sgnUsd(r2(R * p.riskD))} (${fmtR(R)})</td><td><button class="btn" type="button" id="tbClose">Close</button></td></tr></tbody></table>`;

  }
  const G = store.games.slice().reverse().slice(0, 60);
  return G.length ? `<table class="tbl"><thead><tr><th>Day</th><th>TJR</th><th>Your call</th><th>Bias</th><th>Trade</th><th>Result</th></tr></thead><tbody>${G.map(x => `<tr><td>${esc(x.d)}</td><td>${esc(x.v)}</td><td>${x.call === "skip" ? "No-trade" : "Trade"} ${x.callOk ? "✓" : "✗"}</td><td>${{bull: "Bull", bear: "Bear", none: "None"}[x.bias] || "--"} ${x.biasOk == null ? "" : x.biasOk ? "✓" : "✗"}</td><td>${x.trade ? `${x.trade.side === "long" ? "Buy" : "Sell"} ${esc(x.trade.inT)}` : "--"}</td><td class="${x.trade ? (x.trade.R >= 0 ? "ok" : "bad") : ""}">${x.trade ? fmtR(x.trade.R) : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">Finish a day and it shows up here.</div>`;
}
function renderLiveReplay() { renderClock(); renderStrip(); renderLegend(null); if (!timer || g.pos) renderRight(); renderBottom(); }

// ================================================================ level map, stats, new day

      <div class="lv">${ls.map(L => { const b = P.best[L.n]; return `<button class="lvb ${b ? "done" : ""}" type="button" data-lv="${L.n}" ${open ? "" : "disabled"}>${L.n}<small>${b ? starStr(b.stars) : '<span class="off">★★★</span>'}</small></button>`; }).join("")}</div></div>`;
  });

  $("mapBody").querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { if (store.settings.mode !== "levels") { store.settings.mode = "levels"; lsSet("pit-settings", store.settings); } startLevel(+b.dataset.lv); });

    <h3>Chart opens at (New York)</h3><div class="choices">${opt("start", 480, "8:00am", s.start)}${opt("start", 540, "9:00am", s.start)}${opt("start", 565, "9:25am", s.start)}</div>
    <h3>Which days</h3><div class="choices">${opt("pool", "all", "Any day", s.pool)}${opt("pool", "trade", "Only days TJR trades", s.pool)}${opt("pool", "news", "Only big-news days", s.pool)}</div>

function pct(a, b) { return b ? Math.round(100 * a / b) + "%" : "--"; }
function showStats() {
  stopTimer();

    <div class="tile"><div class="k">Picked TJR's direction</div><div class="v">${pct(sameDir.length, T.length)}</div></div>
    <div class="tile"><div class="k">Average per level</div><div class="v">${T.length ? fmtR(sumR / T.length) : "--"}</div></div></div>
    <h3>Replay a day</h3><div class="grid3">

// ================================================================ controls
function setMode(mode) {
  store.settings.mode = mode; lsSet("pit-settings", store.settings);
  stopTimer(); $("result").hidden = true;

  if (mode === "levels") startLevel(nextLevelN(0) || 1);

}
$("modeLevels").onclick = () => { if (store.settings.mode !== "levels") setMode("levels"); };
$("modeReplay").onclick = () => { if (store.settings.mode !== "replay") setMode("replay"); };
$("mapBtn").onclick = () => store.settings.mode === "levels" ? showMap() : showNewDay();

for (const id of OVERLAYS) $(id).addEventListener("click", e => { if (e.target.id === id) $(id).hidden = true; });
document.addEventListener("keydown", e => {
  if (!g || /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (OVERLAYS.some(id => !$(id).hidden)) { if (e.key === "Escape") OVERLAYS.forEach(id => { $(id).hidden = true; }); return; }
  const k = e.key.toLowerCase();
  if (e.altKey) {
    const map = {t: "trend", h: "hline", v: "vline", f: "fib", r: "rect", j: "ray"};
    if (map[k]) { e.preventDefault(); setTool(map[k]); }
    return;
  }
  if (e.key === "Escape") { D.draft = null; D.op = null; setTool("cursor"); D.sel = null; renderSel(); redraw(); return; }
  if ((e.key === "Delete" || e.key === "Backspace") && D.sel) { e.preventDefault(); deleteSel(); return; }
  if (g.mode === "replay") {
    if (e.key === " ") { e.preventDefault(); play(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); stopTimer(); step(e.shiftKey ? 5 : 1); }
    else if (k === "b") openTicket("long"); else if (k === "s") openTicket("short");
  } else {
    if (e.key === "ArrowRight") { e.preventDefault(); nextCandle(e.shiftKey ? 5 : 1); return; }
    if (e.key === " " && g.phase === "playing") { e.preventDefault(); timer ? pausePlay() : resumePlay(); return; }
    if (g.phase === "predict") {
      if (k === "b") betSide("long"); else if (k === "s") betSide("short");
      else if (e.key === "Enter" && !betCheck()) playOut();
    }
  }
});

// ================================================================ boot (a level or day in progress survives page updates)
function snapshotState() {
  if (!g) return {};
  const base = {drawings: D.list.filter(d => !d.tjr), tf: g.tf};
  if (g.mode === "levels") return Object.assign(base, {mode: "levels", level: g.level.n, practice: g.practice, phase: g.phase, bet: g.bet});
  return Object.assign(base, {mode: "replay", day: {dayD: g.day.d, cursor: g.cursor, bias: g.bias, call: g.call, phase: g.phase, order: g.order, pos: g.pos, trades: g.trades,
    tape: g.tape, num: g.num, ended: g.ended, saved: g.saved, startMin: g.startMin, strict: g.strict}});
}
async function start(data) {
  if (!("DecompressionStream" in window)) { $("fatal").innerHTML = `<div class="err">This browser is too old for Practice Pit. Update Chrome, Edge or Safari.</div>`; return; }
  if (!window.LightweightCharts) { $("fatal").innerHTML = `<div class="err">The chart library didn't load. Check your connection and reload.</div>`; return; }
  makeChart(); renderTools();
  try {
    DAYS = JSON.parse(new TextDecoder().decode(await gunzip(await loadFile("days"))));
    LEVELS = await loadFile("levels");
  } catch (e) { $("fatal").innerHTML = `<div class="err">Couldn't load the game data (${esc(e.message)}). Reload to try again.</div>`; return; }
  connectDb();
  const s = data || {};
  if (s.mode === "levels" && s.level) {
    store.settings.mode = "levels";
    await startLevel(s.level, s.practice);
    if (g && s.phase === "predict" && s.bet) g.bet = s.bet;
  } else if (s.mode === "replay" && s.day) {
    store.settings.mode = "replay";
    const x = s.day;
    await dealDay({dayD: x.dayD, cursorMin: mod(x.cursor)});
    if (g) Object.assign(g, {bias: x.bias, call: x.call, phase: x.phase, order: x.order, pos: x.pos, trades: x.trades || [], tape: x.tape || [], num: x.num, ended: x.ended, saved: x.saved, startMin: x.startMin, strict: x.strict});
  } else if (store.settings.mode === "replay") await dealDay();
  else { await startLevel(nextLevelN(0) || 1); if (!Object.keys(store.prog.best).length) showMap(); }
  if (g) {
    if (s.drawings) D.list = s.drawings;
    if (s.tf) g.tf = s.tf;
    rebuild(); renderAll();
  }
}
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(snapshotState);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
